version: '3.8'

services:
  shop-review:
    build:
      context: .
      dockerfile: Dockerfile
    container_name: rating-generator
    ports:
      - "5200:5200"
    restart: unless-stopped
    environment:
      - TZ=Asia/Shanghai
    volumes:
      # 持久化日志文件
      - ./logs:/app/logs
      # 持久化配置文件（如果需要）
      - ./config.yaml:/app/config.yaml:ro
    networks:
      - shop-review-network

networks:
  shop-review-network:
    driver: bridge
